ndex="0"></canvas></main><div id="loading"><h1>iroHa 大福パズル</h1><small>大福パズルを読み込んでいます</small><progress max="1" value="0"></progress><div id="error" role="alert"></div></div><button id="skip-tutorial" hidden>説明をスキップ</button><button id="game-audio" type="button" style="left:50%;right:auto;top:7px;bottom:auto;z-index:3;transform:translateX(-50%)" aria-pressed="false">音声：オン</button><script src="Build/iroha-footer-names-webgl.loader.js?v=7"></script><script>const canvas=document.getElementById('unity-canvas');createUnityInstance(canvas,{dataUrl:'Build/iroha-footer-names-webgl.data.unityweb?v=7',frameworkUrl:'Build/iroha-footer-names-webgl.framework.js.unityweb?v=7',codeUrl:'Build/iroha-footer-names-webgl.wasm.unityweb?v=7',streamingAssetsUrl:'StreamingAssets',companyName:'DefaultCompany',productName:'iroHa 大福パズル',productVersion:'1.0',showBanner:(message,type)=>{if(type==='error')document.getElementById('error').textContent=message}},p=>document.querySelector('progress').value=p).then(instance=>{window.irohaPerformance.attach(instance);window.addEventListener('iroha-audio-change',event=>instance.SendMessage('IrohaAudioPolicy','SetAudioEnabled',event.detail?'1':'0'));document.getElementById('loading').remove();document.getElementById('skip-tutorial').onclick=()=>instance.SendMessage('GardenWebLevelInput','SkipTutorial');window.addEventListener('blur',()=>instance.SendMessage('GardenWebLevelInput','CancelPointer'));canvas.addEventListener('pointercancel',()=>instance.SendMessage('GardenWebLevelInput','CancelPointer'));canvas.focus()}).catch(err=>document.getElementById('error').textContent='ゲームを読み込めませんでした。ページを再読み込みしてください。\n'+err);</script></body></html>
